<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi jueguito rosa</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 10px;background:#fce8f5;color:#71365d;font-family:Verdana,Arial,sans-serif}
.console{width:min(820px,100%);margin:auto;position:relative;padding:20px 24px 22px;background:linear-gradient(145deg,#ffc8e6,#f59acb);border:5px solid #fff8fc;border-radius:48px;box-shadow:inset 0 0 0 3px #e88cbd,0 10px 0 #c66b9c,0 20px 35px #9e477533}
.brand{text-align:center;font-size:clamp(20px,4vw,30px);font-weight:1000;letter-spacing:2px;color:#a43d79;text-shadow:2px 2px white;margin:0 0 12px}
.brand small{display:block;font-size:9px;letter-spacing:4px;margin-top:4px}
.upper-wrap,.lower-wrap{background:#f9d8eb;border:4px solid #fff8fc;border-radius:25px;padding:12px;box-shadow:inset 0 0 0 2px #df8eb9,0 4px 0 #d278a9}
.upper-wrap{width:78%;margin:auto}
.label{font-size:10px;font-weight:bold;letter-spacing:2px;text-align:center;margin:0 0 8px;color:#a4497d}
.screen{height:clamp(220px,38vw,350px);background:#211629;border:8px solid #d879ac;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 15px #000}
.screen iframe{width:100%;height:100%;border:0}.welcome{height:100%;display:grid;place-content:center;text-align:center;color:#ffe6f5;background:radial-gradient(#673452,#211629 70%);padding:15px}.welcome b{font-size:clamp(22px,4vw,34px)}.welcome span{font-size:12px;margin-top:9px}
.hinge{height:25px;display:flex;justify-content:center;align-items:center;gap:8px}.hinge span{width:45px;height:7px;border-radius:8px;background:#d276a8;box-shadow:inset 0 1px 2px #9c4c79}.mic{font-size:9px;font-weight:bold;letter-spacing:2px;color:#a54b7c}
.bottom-row{display:grid;grid-template-columns:94px minmax(0,1fr) 94px;gap:12px;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:14px}.pad{width:76px;height:76px;position:relative}.pad button{position:absolute;width:26px;height:26px;border:0;border-radius:5px;background:linear-gradient(#fff,#e7b7d3);box-shadow:0 3px 0 #b96796;color:#97416f;font-size:14px;font-weight:bold}.pad .up{left:25px;top:0}.pad .down{left:25px;bottom:0}.pad .left{left:0;top:25px}.pad .right{right:0;top:25px}.pad .center{left:25px;top:25px;background:#d88ab5;box-shadow:none}
.action-grid{display:grid;grid-template-columns:repeat(2,36px);gap:8px;transform:rotate(-18deg)}.action-grid button{width:36px;height:36px;border:2px solid #fff;border-radius:50%;background:#d9579e;color:white;font-weight:900;box-shadow:0 3px 0 #a9447b}.action-grid button:nth-child(2),.action-grid button:nth-child(3){background:#ef8bbd}
.lower-wrap{min-width:0}.lower-screen{min-height:190px;background:#fff8fc;border:5px solid #d879ac;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 2px #f2c2dc}
.lower-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.lower-head b{font-size:11px;letter-spacing:1px}.back,.play{border:0;border-radius:20px;background:#b64d87;color:#fff;padding:7px 12px;font-weight:bold;cursor:pointer}
.search{width:100%;padding:9px;border:2px solid #efbfd9;border-radius:12px;font:inherit;font-size:12px}.cats{display:flex;gap:6px;overflow:auto;padding:8px 0}.chip{border:1px solid #e6a8cb;border-radius:20px;background:white;color:#9b4776;padding:6px 10px;font-size:10px;white-space:nowrap;cursor:pointer}.chip.active{background:#bd5790;color:white}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:115px;overflow:auto}.game{border:1px solid #edbed8;border-radius:10px;background:white;padding:7px 3px;color:#824064;cursor:pointer;font-size:10px}.cover{font-size:25px;display:block;margin-bottom:3px}.detail{display:none;text-align:center;font-size:12px}.detail.show{display:block}.detail h3{margin:4px}.detail p{margin:6px}
.small-buttons{display:flex;gap:9px;justify-content:center;margin-top:10px}.small-buttons button{border:0;border-radius:12px;background:#fff4fa;color:#994878;padding:6px 12px;font-size:9px;font-weight:bold;box-shadow:0 2px 0 #d98db7}
.bunny{font-size:34px;filter:drop-shadow(1px 2px white)}.decor{position:absolute;pointer-events:none;font-size:20px}.straw1{top:85px;left:8px}.straw2{top:85px;right:8px}.heart1{bottom:20px;left:12px}.heart2{bottom:20px;right:12px}
.note{text-align:center;font-size:9px;color:#99577b;margin:12px 0 0}
@media(max-width:560px){body{padding:12px 5px}.console{padding:13px 9px;border-radius:30px}.upper-wrap{width:94%;padding:8px}.bottom-row{grid-template-columns:57px minmax(0,1fr) 57px;gap:5px}.pad{transform:scale(.72)}.action-grid{transform:scale(.75) rotate(-18deg)}.lower-wrap{padding:7px}.lower-screen{padding:7px;min-height:185px}.games{grid-template-columns:repeat(2,minmax(0,1fr))}.decor{font-size:15px}.bunny{font-size:26px}.small-buttons{gap:4px}.small-buttons button{padding:6px 7px}}
</style>
</head>
<body>
<main class="console">
<span class="decor straw1">🍓</span><span class="decor straw2">🍓</span><span class="decor heart1">♡</span><span class="decor heart2">♡</span>
<h1 class="brand">♡ MI JUEGUITO ROSA ♡<small>MY LITTLE PINK WORLD</small></h1>
<section class="upper-wrap"><p class="label">01 · GAME SCREEN</p><div class="screen" id="top"><div class="welcome"><b>🎀 ¡HOLA, LIZ! 🎀</b><span>Selecciona un jueguito en la pantalla de abajo</span></div></div></section>
<div class="hinge"><span></span><span></span><span></span><b class="mic">MIC · · ·</b><span></span><span></span><span></span></div>
<div class="bottom-row">
<aside class="side"><div class="pad" aria-label="Cruceta"><button class="up" data-control="ArrowUp">▲</button><button class="down" data-control="ArrowDown">▼</button><button class="left" data-control="ArrowLeft">◀</button><button class="right" data-control="ArrowRight">▶</button><button class="center" tabindex="-1"></button></div><div class="bunny">🐰</div></aside>
<section class="lower-wrap"><div class="lower-screen">
<div class="lower-head"><b>02 · MENÚ</b><button class="back" id="back">↶ VOLVER</button></div>
<div id="menu"><input class="search" id="search" placeholder="⌕ Buscar juegos..."><div class="cats" id="cats"><button class="chip active" data-cat="Todos">Todos</button><button class="chip" data-cat="Moda">Moda</button><button class="chip" data-cat="Monster High">Monster High</button></div><div class="games" id="games"><button class="game" data-game="draculaura"><span class="cover">🦇💗</span>Draculaura Blind Date</button></div></div>
<div class="detail" id="detail"><div style="font-size:28px">🦇💗</div><h3>Draculaura Blind Date</h3><p>Elige su peinado, ropa y accesorios.</p><p>Control: mouse o pantalla táctil.</p><button class="play" id="play">JUGAR ♡</button></div>
</div><div class="small-buttons"><button>START</button><button>SELECT</button></div></section>
<aside class="side"><div class="action-grid"><button data-control="x">X</button><button data-control="y">Y</button><button data-control="b">B</button><button data-control="a">A</button></div><div style="font-size:9px;font-weight:bold;letter-spacing:2px;color:#9c4778">♡ POWER ♡</div></aside>
</div>
<p class="note">🍓 FRESITAS · CORAZONES · PIXEL LOVE 🍓</p>
</main>
<script>
(()=>{const top=document.getElementById('top'),menu=document.getElementById('menu'),detail=document.getElementById('detail'),back=document.getElementById('back'),games=document.getElementById('games');let chosen='';function home(){top.innerHTML='<div class="welcome"><b>🎀 ¡HOLA, LIZ! 🎀</b><span>Selecciona un jueguito en la pantalla de abajo</span></div>';menu.style.display='block';detail.classList.remove('show');chosen=''}games.addEventListener('click',e=>{let g=e.target.closest('[data-game]');if(g){chosen=g.dataset.game;menu.style.display='none';detail.classList.add('show')}});document.getElementById('play').onclick=()=>{if(chosen==='draculaura'){top.innerHTML='<iframe title="Draculaura Blind Date" src="https://kiz10.com/embed/draculaura-blind-date/" allow="fullscreen; autoplay" allowfullscreen></iframe>';detail.classList.remove('show')}};back.onclick=home;document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();games.querySelectorAll('.game').forEach(g=>g.style.display=g.innerText.toLowerCase().includes(q)?'':'none')};document.getElementById('cats').onclick=e=>{let c=e.target.closest('[data-cat]');if(!c)return;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));games.querySelectorAll('.game').forEach(g=>g.style.display=c.dataset.cat==='Todos'||g.innerText.includes(c.dataset.cat)?'':'none')};document.querySelectorAll('[data-control]').forEach(b=>b.onclick=()=>{let k=b.dataset.control;document.dispatchEvent(new KeyboardEvent('keydown',{key:({x:'x',y:'y',a:'a',b:'b'}[k]||k),bubbles:true}))});home()})();
</script>
</body></html>
